  # ---------------------------------------------------------------- encryption
  - id: fortify.weak-encryption-insecure-initialization-vector
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Weak Encryption: Insecure Initialization Vector: the IV is a constant (a literal, a zero buffer
      or a hardcoded string), so two messages encrypted with the same key leak their relationship and
      GCM/CTR nonce reuse breaks the cipher outright. Generate a fresh random IV per message with
      crypto.randomBytes and store it with the ciphertext.
    metadata:
      fortify:
        category: "Weak Encryption: Insecure Initialization Vector"
        kingdom: Security Features
        impact: "3.0"
        probability: "3.0"
        accuracy: "4.0"
        confidence: "4.0"
        abstract: A cipher is initialised with a constant IV.
      cwe: ["CWE-329", "CWE-1204"]
      owasp: ["A02:2021 Cryptographic Failures"]
    pattern-either:
      - pattern: $C.createCipheriv($ALG, $KEY, "...", ...)
      - pattern: createCipheriv($ALG, $KEY, "...", ...)
      - pattern: $C.createCipheriv($ALG, $KEY, Buffer.alloc($N), ...)
      - pattern: createCipheriv($ALG, $KEY, Buffer.alloc($N), ...)
