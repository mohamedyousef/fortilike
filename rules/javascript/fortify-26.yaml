  # ---------------------------------------------------------------- browser DOM
  - id: fortify.dynamic-code-evaluation-script-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Dynamic Code Evaluation: Script Injection: a script element is created and its source or body is
      set from a computed value, so whoever controls that value runs code in the page. Load scripts
      from a fixed allow-list of URLs (with Subresource Integrity), never from data.
    metadata:
      fortify:
        category: "Dynamic Code Evaluation: Script Injection"
