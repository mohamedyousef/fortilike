  - id: fortify.weak-cryptographic-hash-insecure-pbe-iteration-count
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Weak Cryptographic Hash: Insecure PBE Iteration Count: PBKDF2 runs fewer than 10000 iterations,
      so a GPU tries billions of guesses per second. Use at least 600000 iterations for SHA-256 (OWASP
      2023), or switch to scrypt / Argon2.
    metadata:
      fortify:
        category: "Weak Cryptographic Hash: Insecure PBE Iteration Count"
        kingdom: Security Features
        impact: "2.0"
        probability: "4.0"
