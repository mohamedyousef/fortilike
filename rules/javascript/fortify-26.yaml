      - pattern: createCipheriv($ALG, $KEY, Buffer.alloc($N, $FILL), ...)
      - pattern: $C.createCipheriv($ALG, $KEY, Buffer.from("...", ...), ...)
      - pattern: createCipheriv($ALG, $KEY, Buffer.from("...", ...), ...)
      - pattern: $C.createCipheriv($ALG, $KEY, new Uint8Array($N), ...)
      - pattern: createCipheriv($ALG, $KEY, new Uint8Array($N), ...)
      - patterns:
          - pattern-either:
              - pattern: $C.createCipheriv($ALG, $KEY, $IV, ...)
              - pattern: createCipheriv($ALG, $KEY, $IV, ...)
          - pattern-either:
              - pattern-inside: |
                  const $IV = "...";
                  ...
              - pattern-inside: |
                  const $IV = Buffer.from("...", ...);
                  ...
              - pattern-inside: |
                  const $IV = Buffer.alloc($N, ...);
                  ...
              - pattern-inside: |
                  let $IV = "...";
                  ...
              - pattern-inside: |
                  let $IV = Buffer.from("...", ...);
                  ...

  - id: fortify.weak-encryption-stream-cipher
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Weak Encryption: Stream Cipher: RC4, bare ChaCha20 or Salsa20 encrypt without authentication (and
      RC4 is broken outright), so ciphertext can be flipped bit by bit and keystream reuse reveals the
      plaintext. Use an AEAD cipher: aes-256-gcm or chacha20-poly1305.
    metadata:
      fortify:
        category: "Weak Encryption: Stream Cipher"
        kingdom: Security Features
        impact: "3.0"
        probability: "2.0"
        accuracy: "5.0"
        confidence: "5.0"
        abstract: An unauthenticated stream cipher is used.
      cwe: ["CWE-327"]
      owasp: ["A02:2021 Cryptographic Failures"]
    patterns:
      - pattern-either:
          - pattern: $F("$ALG", ...)
          - pattern: $C.$F("$ALG", ...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(createCipheriv|createDecipheriv|createCipher|createDecipher)$
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^(rc4(-\d+)?(-hmac-md5)?|arcfour|chacha20|salsa20|xsalsa20)$

  - id: fortify.weak-encryption-non-pqc-resilient-algorithm
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Weak Encryption: Non PQC Resilient Algorithm: RSA, DSA, (EC)DH and elliptic-curve signatures rest
      on problems a cryptographically relevant quantum computer solves, so data protected today can be
      decrypted or forged later. Plan the move to ML-KEM / ML-DSA (FIPS 203/204) or hybrid schemes for
      long-lived data and signatures.
    metadata:
      fortify:
        category: "Weak Encryption: Non PQC Resilient Algorithm"
        kingdom: Security Features
        impact: "2.0"
        probability: "4.0"
        accuracy: "4.0"
        confidence: "5.0"
        abstract: A public-key algorithm without post-quantum resistance is used.
      cwe: ["CWE-327"]
      owasp: ["A02:2021 Cryptographic Failures"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $F("$ALG", ...)
              - pattern: $C.$F("$ALG", ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(generateKeyPair|generateKeyPairSync)$
          - metavariable-regex:
              metavariable: $ALG
              regex: ^(rsa|rsa-pss|ec|ed25519|ed448|x25519|x448|dsa|dh|(ES|RS|PS)\d+|EdDSA|ECDH-ES(\+A\d+KW)?|RSA-OAEP(-\d+)?|RSA1_5)$
      - pattern: createECDH(...)
      - pattern: $C.createECDH(...)
      - pattern: createDiffieHellman(...)
      - pattern: $C.createDiffieHellman(...)
      - pattern: createDiffieHellmanGroup(...)
      - pattern: $C.createDiffieHellmanGroup(...)
      - pattern: getDiffieHellman(...)
      - pattern: $C.getDiffieHellman(...)
      - patterns:
          - pattern: '$S.generateKey({ ..., name: "$ALG", ... }, ...)'
          - metavariable-regex:
              metavariable: $ALG
              regex: ^(RSA-OAEP|RSA-PSS|RSASSA-PKCS1-v1_5|ECDSA|ECDH|Ed25519|X25519)$
      - patterns:
          - pattern-either:
              - pattern: $F($K, "$ALG", ...)
              - pattern: $C.$F($K, "$ALG", ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(importJWK|importPKCS8|importSPKI|importX509)$
          - metavariable-regex:
              metavariable: $ALG
              regex: ^((ES|RS|PS)\d+|EdDSA|ECDH-ES(\+A\d+KW)?|RSA-OAEP(-\d+)?|RSA1_5)$

  # ---------------------------------------------------------------- logging
  - id: fortify.poor-logging-practice-use-of-a-system-output-stream
    languages: [javascript, typescript]
    severity: INFO
    message: >-
      Poor Logging Practice: Use of a System Output Stream: output goes straight to the console or the
      process's stdout/stderr, so it cannot be levelled, routed or redacted, and sensitive values end
      up in whatever captures the terminal. Use the application logger.
    metadata:
      fortify:
        category: "Poor Logging Practice: Use of a System Output Stream"
        kingdom: Encapsulation
        impact: "1.0"
        probability: "2.0"
        accuracy: "5.0"
        confidence: "5.0"
        abstract: Output is written directly to the console or a standard stream.
      cwe: ["CWE-532"]
      owasp: ["A09:2021 Security Logging and Monitoring Failures"]
    pattern-either:
      - patterns:
          - pattern: console.$M(...)
          - metavariable-regex:
              metavariable: $M
              regex: ^(log|info|warn|error|debug|trace|dir|table)$
      - pattern: process.stdout.write(...)
      - pattern: process.stderr.write(...)

