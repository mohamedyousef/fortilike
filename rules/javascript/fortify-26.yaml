# Categories added with Fortify rulepack 26.x in mind: cookie SameSite / domain / path, YAML, GraphQL,
# Handlebars and Helmet configuration, deprecated and missing security headers, key material for HMAC
# and password-based encryption, IVs and stream ciphers, non-PQC algorithms, console output, React
# dangerouslySetInnerHTML, Content-Length, LLM token limits, script injection,
# document.domain, poorly validated HTML, reflected CORS origins and reverse DNS.
rules:
  # ---------------------------------------------------------------- cookies
  - id: fortify.cookie-security-missing-samesite-attribute
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Cookie Security: Missing SameSite Attribute: the cookie is set without a SameSite attribute, so
      browsers that do not default to Lax send it on cross-site requests and a forged request carries
      the session. Set sameSite to 'lax' or 'strict'.
    metadata:
      fortify:
        category: "Cookie Security: Missing SameSite Attribute"
        kingdom: Security Features
        impact: "2.0"
        probability: "3.0"
        accuracy: "4.0"
        confidence: "4.0"
        abstract: A cookie is set without the SameSite attribute.
      cwe: ["CWE-1275"]
      owasp: ["A05:2021 Security Misconfiguration"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $RES.cookie($N, $V)
              - pattern: $RES.cookie($N, $V, $OPTS)
          - pattern-not: '$RES.cookie($N, $V, { ..., sameSite: $S, ... })'
      - patterns:
          - pattern-either:
              - pattern: $REP.setCookie($N, $V)
              - pattern: $REP.setCookie($N, $V, $OPTS)
          - pattern-not: '$REP.setCookie($N, $V, { ..., sameSite: $S, ... })'
      - patterns:
          - pattern-either:
              - pattern: $C.set($N, $V)
              - pattern: $C.set($N, $V, $OPTS)
          - pattern-not: '$C.set($N, $V, { ..., sameSite: $S, ... })'
          - metavariable-regex:
              metavariable: $C
              regex: (?i)^(cookies?|cookieJar|cookieStore)$
      - patterns:
          - pattern: new Cookie({ ... })
          - pattern-not: 'new Cookie({ ..., sameSite: $S, ... })'
      - patterns:
          - pattern-either:
              - pattern: $RES.setHeader("$H", "$C")
              - pattern: $RES.header("$H", "$C")
              - pattern: $RES.set("$H", "$C")
              - pattern: '$RES.writeHead($S, { ..., "$H": "$C", ... })'
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^set-cookie$
          - metavariable-regex:
              metavariable: $C
              regex: (?i)^(?!.*;\s*samesite=).*$

  - id: fortify.cookie-security-overly-permissive-samesite-attribute
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Cookie Security: Overly Permissive SameSite Attribute: SameSite=None sends the cookie on every
      cross-site request, which removes the browser's protection against cross-site request forgery.
      Use 'lax' or 'strict' unless the cookie must be embedded cross-site.
    metadata:
      fortify:
        category: "Cookie Security: Overly Permissive SameSite Attribute"
        kingdom: Security Features
        impact: "2.0"
        probability: "3.0"
        accuracy: "5.0"
        confidence: "5.0"
        abstract: A cookie is set with SameSite=None.
      cwe: ["CWE-1275"]
      owasp: ["A05:2021 Security Misconfiguration"]
    pattern-either:
      - patterns:
          - pattern: '{ ..., sameSite: "$S", ... }'
          - metavariable-regex:
              metavariable: $S
              regex: (?i)^none$
      - patterns:
          - pattern-either:
              - pattern: $RES.setHeader("$H", "$C")
              - pattern: $RES.header("$H", "$C")
              - pattern: $RES.set("$H", "$C")
              - pattern: '$RES.writeHead($S, { ..., "$H": "$C", ... })'
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^set-cookie$
          - metavariable-regex:
              metavariable: $C
              regex: (?i).*;\s*samesite=none.*

  - id: fortify.cookie-security-overly-broad-domain
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Cookie Security: Overly Broad Domain: the cookie's Domain starts with a dot, so every subdomain
      (including ones run by other teams or an attacker-controlled host) receives it. Leave Domain
      unset so the cookie stays with the host that issued it.
    metadata:
      fortify:
        category: "Cookie Security: Overly Broad Domain"
        kingdom: Security Features
        impact: "2.0"
        probability: "2.0"
        accuracy: "4.0"
        confidence: "4.0"
        abstract: A cookie is scoped to a parent domain and all of its subdomains.
      cwe: ["CWE-1004", "CWE-287"]
      owasp: ["A05:2021 Security Misconfiguration"]
    pattern-either:
      - patterns:
          - pattern: '{ ..., domain: "$D", ... }'
          - metavariable-regex:
              metavariable: $D
              regex: ^\..+
      - patterns:
          - pattern-either:
              - pattern: $RES.setHeader("$H", "$C")
              - pattern: $RES.header("$H", "$C")
              - pattern: $RES.set("$H", "$C")
              - pattern: '$RES.writeHead($S, { ..., "$H": "$C", ... })'
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^set-cookie$
          - metavariable-regex:
              metavariable: $C
              regex: (?i).*;\s*domain=\..*

  - id: fortify.cookie-security-overly-broad-path
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Cookie Security: Overly Broad Path: the cookie is scoped to '/', so every application served
      from the same host reads it. Set Path to the application's own prefix.
    metadata:
      fortify:
        category: "Cookie Security: Overly Broad Path"
        kingdom: Security Features
        impact: "1.0"
        probability: "2.0"
        accuracy: "4.0"
        confidence: "4.0"
        abstract: A cookie is scoped to the root path of the host.
      cwe: ["CWE-1004"]
      owasp: ["A05:2021 Security Misconfiguration"]
    pattern-either:
      - pattern: '$RES.cookie($N, $V, { ..., path: "/", ... })'
      - pattern: '$REP.setCookie($N, $V, { ..., path: "/", ... })'
      - pattern: '$REP.clearCookie($N, { ..., path: "/", ... })'
      - patterns:
          - pattern: '$C.set($N, $V, { ..., path: "/", ... })'
          - metavariable-regex:
              metavariable: $C
              regex: (?i)^(cookies?|cookieJar|cookieStore)$
      - pattern: 'new Cookie({ ..., path: "/", ... })'
      - pattern: '$S({ ..., cookie: { ..., path: "/", ... }, ... })'
      - patterns:
          - pattern-either:
              - pattern: $RES.setHeader("$H", "$C")
              - pattern: $RES.header("$H", "$C")
              - pattern: $RES.set("$H", "$C")
              - pattern: '$RES.writeHead($S, { ..., "$H": "$C", ... })'
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^set-cookie$
          - metavariable-regex:
              metavariable: $C
              regex: (?i).*;\s*path=/\s*(;.*)?$

  # ---------------------------------------------------------------- yaml
  - id: fortify.dynamic-code-evaluation-unsafe-yaml-deserialization
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Dynamic Code Evaluation: Unsafe YAML Deserialization: js-yaml's load() runs with the default
      schema, which in older versions instantiates JavaScript types (!!js/function) from the document,
      so a crafted file runs code. Pass { schema: JSON_SCHEMA } (or FAILSAFE_SCHEMA), or use safeLoad.
    metadata:
      fortify:
        category: "Dynamic Code Evaluation: Unsafe YAML Deserialization"
        kingdom: Input Validation and Representation
        impact: "4.0"
        probability: "2.0"
        accuracy: "4.0"
        confidence: "4.0"
        abstract: YAML is parsed with a schema that can create arbitrary JavaScript values.
      cwe: ["CWE-502"]
      owasp: ["A08:2021 Software and Data Integrity Failures"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $Y.$F($X)
              - pattern: $Y.$F($X, $O)
          - pattern-not: '$Y.$F($X, { ..., schema: $S, ... })'
          - metavariable-regex:
              metavariable: $Y
              regex: ^(yaml|jsyaml|jsYaml|js_yaml|YAML)$
          - metavariable-regex:
              metavariable: $F
              regex: ^(load|loadAll)$
      - patterns:
          - pattern-either:
              - pattern: require("js-yaml").$F($X)
              - pattern: require("js-yaml").$F($X, $O)
          - pattern-not: 'require("js-yaml").$F($X, { ..., schema: $S, ... })'
          - metavariable-regex:
              metavariable: $F
              regex: ^(load|loadAll)$

  # ---------------------------------------------------------------- GraphQL
  - id: fortify.graphql-bad-practices-graphiql-enabled
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      GraphQL Bad Practices: GraphiQL Enabled: the GraphiQL explorer is served, which hands anyone who
      finds the endpoint a schema browser and a query console. Turn it off outside development.
    metadata:
      fortify:
        category: "GraphQL Bad Practices: GraphiQL Enabled"
        kingdom: Security Features
        impact: "2.0"
        probability: "3.0"
        accuracy: "5.0"
        confidence: "5.0"
        abstract: A GraphQL server is configured to serve the GraphiQL explorer.
      cwe: ["CWE-489"]
      owasp: ["A05:2021 Security Misconfiguration"]
    pattern-either:
      - pattern: '{ ..., graphiql: true, ... }'
      - pattern: '{ ..., graphiql: { ... }, ... }'

  - id: fortify.graphql-bad-practices-introspection-enabled
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      GraphQL Bad Practices: Introspection Enabled: schema introspection is turned on explicitly, so a
      client enumerates every type, field and mutation before attacking them. Disable introspection
      in production (introspection: process.env.NODE_ENV !== 'production').
    metadata:
      fortify:
        category: "GraphQL Bad Practices: Introspection Enabled"
        kingdom: Security Features
        impact: "2.0"
        probability: "3.0"
        accuracy: "5.0"
        confidence: "5.0"
        abstract: A GraphQL server exposes schema introspection.
      cwe: ["CWE-200"]
      owasp: ["A05:2021 Security Misconfiguration"]
    pattern: '{ ..., introspection: true, ... }'

  # ---------------------------------------------------------------- Handlebars
  - id: fortify.handlebars-misconfiguration-escaping-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Handlebars Misconfiguration: Escaping Disabled: noEscape turns off HTML escaping for every
      {{expression}} in the template, so any value that reaches the template becomes markup. Keep
      escaping on and use {{{triple-stash}}} only for trusted, pre-sanitized HTML.
    metadata:
      fortify:
        category: "Handlebars Misconfiguration: Escaping Disabled"
        kingdom: Input Validation and Representation
        impact: "3.0"
        probability: "3.0"
        accuracy: "5.0"
        confidence: "5.0"
        abstract: Handlebars is compiled with HTML escaping disabled.
      cwe: ["CWE-79", "CWE-116"]
      owasp: ["A03:2021 Injection"]
    pattern: '{ ..., noEscape: true, ... }'

  - id: fortify.handlebars-misconfiguration-prototypes-allowed
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Handlebars Misconfiguration: Prototypes Allowed: allowProtoPropertiesByDefault /
      allowProtoMethodsByDefault let templates reach prototype members of the context objects, the
      path to remote code execution in older Handlebars. Leave the defaults and allow-list only the
      members a template needs.
    metadata:
      fortify:
        category: "Handlebars Misconfiguration: Prototypes Allowed"
        kingdom: Security Features
        impact: "4.0"
        probability: "2.0"
        accuracy: "5.0"
        confidence: "5.0"
        abstract: Handlebars templates may access prototype properties or methods.
      cwe: ["CWE-1321", "CWE-94"]
      owasp: ["A08:2021 Software and Data Integrity Failures"]
    pattern-either:
      - pattern: '{ ..., allowProtoPropertiesByDefault: true, ... }'
      - pattern: '{ ..., allowProtoMethodsByDefault: true, ... }'

  # ---------------------------------------------------------------- Helmet / headers
  - id: fortify.helmet-misconfiguration-insecure-xss-filter
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Helmet Misconfiguration: Insecure XSS Filter: setOnOldIE or mode null turns the browser's XSS
      auditor on without block mode, and that filter itself has been used to leak data in old
      Internet Explorer. Remove the option; modern browsers no longer ship the filter.
    metadata:
      fortify:
        category: "Helmet Misconfiguration: Insecure XSS Filter"
        kingdom: Security Features
        impact: "2.0"
        probability: "2.0"
        accuracy: "5.0"
        confidence: "5.0"
        abstract: Helmet's X-XSS-Protection header is configured in an insecure mode.
      cwe: ["CWE-16", "CWE-79"]
      owasp: ["A05:2021 Security Misconfiguration"]
    pattern-either:
      - pattern: '{ ..., setOnOldIE: true, ... }'
      - pattern: '{ ..., xssFilter: { ..., mode: null, ... }, ... }'
      - pattern: '$H.xssFilter({ ..., mode: null, ... })'

  - id: fortify.html5-cross-site-scripting-protection
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      HTML5: Cross-Site Scripting Protection: the X-XSS-Protection header is set to 0 (or helmet's
      xssFilter is disabled), which switches off the reflected-XSS filter in the browsers that still
      have one. Remove the explicit opt-out, or rely on a Content-Security-Policy instead.
    metadata:
      fortify:
        category: "HTML5: Cross-Site Scripting Protection"
        kingdom: Security Features
        impact: "2.0"
        probability: "2.0"
        accuracy: "5.0"
        confidence: "5.0"
        abstract: The browser's cross-site scripting filter is explicitly disabled.
      cwe: ["CWE-79", "CWE-16"]
      owasp: ["A05:2021 Security Misconfiguration"]
    pattern-either:
      - pattern: '{ ..., xssFilter: false, ... }'
      - patterns:
          - pattern-either:
              - pattern: $RES.setHeader("$H", $V)
              - pattern: $RES.header("$H", $V)
              - pattern: $RES.set("$H", $V)
              - pattern: '$RES.writeHead($S, { ..., "$H": $V, ... })'
              - pattern: '{ ..., headers: { ..., "$H": $V, ... }, ... }'
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^x-xss-protection$
          - metavariable-regex:
              metavariable: $V
              regex: ^['"]?0['"]?$

  - id: fortify.html5-deprecated-header
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      HTML5: Deprecated Header: Public-Key-Pins and Expect-CT are no longer honoured by browsers (HPKP
      was removed, Expect-CT retired in 2023), so the header gives a false sense of protection and
      HPKP can lock users out. Remove it; use Certificate Transparency monitoring instead.
    metadata:
      fortify:
        category: "HTML5: Deprecated Header"
        kingdom: Security Features
        impact: "1.0"
        probability: "2.0"
        accuracy: "5.0"
        confidence: "5.0"
        abstract: A response sets a security header that browsers no longer support.
      cwe: ["CWE-16"]
      owasp: ["A05:2021 Security Misconfiguration"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $RES.setHeader("$H", $V)
              - pattern: $RES.header("$H", $V)
              - pattern: $RES.set("$H", $V)
              - pattern: '$RES.writeHead($S, { ..., "$H": $V, ... })'
              - pattern: '{ ..., headers: { ..., "$H": $V, ... }, ... }'
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^(public-key-pins(-report-only)?|expect-ct)$
      - patterns:
          - pattern: '{ ..., expectCt: $V, ... }'
          - pattern-not: '{ ..., expectCt: false, ... }'
      - patterns:
          - pattern: '{ ..., hpkp: $V, ... }'
          - pattern-not: '{ ..., hpkp: false, ... }'
      - pattern: $H.expectCt(...)
      - pattern: $H.hpkp(...)

  - id: fortify.html5-mime-sniffing
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      HTML5: MIME Sniffing: X-Content-Type-Options is not 'nosniff' (or helmet's noSniff is turned
      off), so browsers may guess a content type and run an upload or JSON response as script.
      Send X-Content-Type-Options: nosniff on every response.
    metadata:
      fortify:
        category: "HTML5: MIME Sniffing"
        kingdom: Security Features
        impact: "2.0"
        probability: "3.0"
        accuracy: "5.0"
        confidence: "5.0"
        abstract: Responses allow the browser to sniff the content type.
      cwe: ["CWE-16", "CWE-430"]
      owasp: ["A05:2021 Security Misconfiguration"]
    pattern-either:
      - pattern: '{ ..., noSniff: false, ... }'
      - pattern: '{ ..., xContentTypeOptions: false, ... }'
      - pattern: '{ ..., contentTypeOptions: false, ... }'
      - patterns:
          - pattern-either:
              - pattern: $RES.setHeader("$H", "$V")
              - pattern: $RES.header("$H", "$V")
              - pattern: $RES.set("$H", "$V")
              - pattern: '$RES.writeHead($S, { ..., "$H": "$V", ... })'
              - pattern: '{ ..., headers: { ..., "$H": "$V", ... }, ... }'
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^x-content-type-options$
          - metavariable-regex:
              metavariable: $V
              regex: (?i)^(?!nosniff$).*$

  - id: fortify.insecure-transport-hsts-not-set
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Insecure Transport: HSTS not Set: Strict-Transport-Security is disabled in helmet, so the first
      request over plain HTTP (and every one after a downgrade) can be intercepted. Leave hsts on with
      a maxAge of at least a year and includeSubDomains.
    metadata:
      fortify:
        category: "Insecure Transport: HSTS not Set"
        kingdom: Security Features
        impact: "2.0"
        probability: "3.0"
        accuracy: "5.0"
        confidence: "5.0"
        abstract: The HTTP Strict Transport Security header is explicitly turned off.
      cwe: ["CWE-319", "CWE-523"]
      owasp: ["A02:2021 Cryptographic Failures"]
    pattern-either:
      - pattern: '{ ..., hsts: false, ... }'
      - pattern: '{ ..., strictTransportSecurity: false, ... }'
      - pattern: '{ ..., hsts: { ..., maxAge: 0, ... }, ... }'

  # ---------------------------------------------------------------- browser storage
  - id: fortify.html5-easy-to-guess-database-name
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      HTML5: Easy-to-Guess Database Name: the client-side database is opened by a fixed literal name,
      so any script that runs in the origin (an XSS, a compromised third-party tag) knows where the
      data lives. Derive the name from the signed-in user or session and keep sensitive data server-side.
    metadata:
      fortify:
        category: "HTML5: Easy-to-Guess Database Name"
        kingdom: Security Features
        impact: "1.0"
        probability: "2.0"
        accuracy: "4.0"
        confidence: "4.0"
        abstract: A browser database is opened with a hardcoded name.
      cwe: ["CWE-922"]
      owasp: ["A04:2021 Insecure Design"]
    pattern-either:
      - pattern: indexedDB.open("...", ...)
      - pattern: window.indexedDB.open("...", ...)
      - pattern: self.indexedDB.open("...", ...)
      - pattern: globalThis.indexedDB.open("...", ...)
      - pattern: openDatabase("...", ...)
      - pattern: window.openDatabase("...", ...)

  # ---------------------------------------------------------------- TLS strength
  - id: fortify.insecure-transport-weak-ssl-cipher
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Insecure Transport: Weak SSL Cipher: the cipher list enables RC4, DES/3DES, export, anonymous,
      NULL or MD5-based suites, which are broken or offer no authentication. Use Node's default list
      or restrict to AEAD suites (ECDHE + AES-GCM / CHACHA20-POLY1305).
    metadata:
      fortify:
        category: "Insecure Transport: Weak SSL Cipher"
        kingdom: Security Features
        impact: "3.0"
        probability: "2.0"
        accuracy: "5.0"
        confidence: "5.0"
        abstract: A TLS configuration enables a weak cipher suite.
      cwe: ["CWE-327", "CWE-326"]
      owasp: ["A02:2021 Cryptographic Failures"]
    patterns:
      - pattern: '{ ..., ciphers: "$C", ... }'
      - metavariable-regex:
          metavariable: $C
          regex: (?i)^(.*[:,\s+])?(RC4|DES|3DES|DES-CBC3|NULL|EXPORT|EXP|MD5|aNULL|eNULL|ADH|AECDH|anon)([-:,\s+]|$).*

  - id: fortify.insecure-transport-insufficient-diffie-hellman-strength
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Insecure Transport: Insufficient Diffie Hellman Strength: a Diffie-Hellman group shorter than
      2048 bits is generated, which Logjam-class attacks break. Use 2048 bits or more, or a named
      elliptic-curve group (createECDH / x25519).
    metadata:
      fortify:
        category: "Insecure Transport: Insufficient Diffie Hellman Strength"
        kingdom: Security Features
        impact: "3.0"
        probability: "2.0"
        accuracy: "5.0"
        confidence: "5.0"
        abstract: A Diffie-Hellman key exchange uses a prime shorter than 2048 bits.
      cwe: ["CWE-326"]
      owasp: ["A02:2021 Cryptographic Failures"]
    patterns:
      - pattern-either:
          - pattern: createDiffieHellman($N, ...)
          - pattern: $C.createDiffieHellman($N, ...)
      - metavariable-comparison:
          metavariable: $N
          comparison: $N < 2048

  # ---------------------------------------------------------------- key material
  - id: fortify.key-management-hardcoded-hmac-key
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Key Management: Hardcoded HMAC Key: the HMAC key is a literal in the source, so everyone with the
      code (or a build artifact) can forge authenticated messages and the key cannot be rotated without
      a release. Load it from a secret store or the environment.
    metadata:
      fortify:
        category: "Key Management: Hardcoded HMAC Key"
        kingdom: Security Features
        impact: "4.0"
        probability: "3.0"
        accuracy: "4.0"
        confidence: "4.0"
        abstract: An HMAC is keyed with a string literal.
      cwe: ["CWE-321", "CWE-798"]
      owasp: ["A02:2021 Cryptographic Failures"]
    patterns:
      - pattern-either:
          - pattern: createHmac($ALG, "$K", ...)
          - pattern: $C.createHmac($ALG, "$K", ...)
          - pattern: createHmac($ALG, Buffer.from("$K", ...), ...)
          - pattern: $C.createHmac($ALG, Buffer.from("$K", ...), ...)
      - metavariable-regex:
          metavariable: $K
          regex: .+

  - id: fortify.key-management-empty-hmac-key
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Key Management: Empty HMAC Key: the HMAC is keyed with an empty string, so the "authentication
      code" is just a hash anyone can compute. Use a random key of at least the digest size.
    metadata:
      fortify:
        category: "Key Management: Empty HMAC Key"
        kingdom: Security Features
        impact: "4.0"
        probability: "2.0"
        accuracy: "5.0"
        confidence: "5.0"
        abstract: An HMAC is keyed with an empty string.
      cwe: ["CWE-321"]
      owasp: ["A02:2021 Cryptographic Failures"]
    pattern-either:
      - pattern: createHmac($ALG, "", ...)
      - pattern: $C.createHmac($ALG, "", ...)
      - pattern: createHmac($ALG, Buffer.alloc(0), ...)
      - pattern: $C.createHmac($ALG, Buffer.alloc(0), ...)

  - id: fortify.key-management-hardcoded-pbe-password
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Key Management: Hardcoded PBE Password: the password that derives the encryption key is a literal
      in the source, so the derived key is as public as the code. Take the password from the user or a
      secret store; never commit it.
    metadata:
      fortify:
        category: "Key Management: Hardcoded PBE Password"
        kingdom: Security Features
        impact: "4.0"
        probability: "3.0"
        accuracy: "4.0"
        confidence: "4.0"
        abstract: A password-based key derivation uses a string literal as the password.
      cwe: ["CWE-321", "CWE-798"]
      owasp: ["A02:2021 Cryptographic Failures"]
    patterns:
      - pattern-either:
          - pattern: $F("$P", ...)
          - pattern: $C.$F("$P", ...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(pbkdf2|pbkdf2Sync|scrypt|scryptSync|hkdf|hkdfSync)$
      - metavariable-regex:
          metavariable: $P
          regex: .+

  - id: fortify.key-management-empty-pbe-password
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
