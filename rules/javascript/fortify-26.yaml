  - id: fortify.cross-site-scripting-sop-bypass
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Cross-Site Scripting: SOP Bypass: document.domain is set, which relaxes the same-origin policy to
      the parent domain, so any subdomain that does the same can script this page. The setter is
      deprecated and ignored by modern browsers; use postMessage between origins instead.
    metadata:
      fortify:
        category: "Cross-Site Scripting: SOP Bypass"
        kingdom: Input Validation and Representation
        impact: "2.0"
        probability: "3.0"
        accuracy: "5.0"
        confidence: "5.0"
        abstract: The page relaxes the same-origin policy by assigning document.domain.
      cwe: ["CWE-79", "CWE-346"]
      owasp: ["A05:2021 Security Misconfiguration"]
    pattern-either:
      - pattern: document.domain = $D
      - pattern: window.document.domain = $D

  - id: fortify.cross-site-scripting-poor-validation
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Cross-Site Scripting: Poor Validation: the value is written as HTML after a URL encoding, escape()
      or a single replace of '<', none of which neutralises attributes, event handlers or other
      contexts. Encode for the HTML context (textContent, a templating engine's escaping, or DOMPurify
      for rich HTML).
    metadata:
      fortify:
        category: "Cross-Site Scripting: Poor Validation"
        kingdom: Input Validation and Representation
        impact: "3.0"
        probability: "2.0"
        accuracy: "4.0"
        confidence: "4.0"
        abstract: HTML output relies on an encoding that does not protect the HTML context.
      cwe: ["CWE-79", "CWE-116"]
      owasp: ["A03:2021 Injection"]
    patterns:
