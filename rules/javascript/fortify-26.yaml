          - pattern: $EL.outerHTML = $V
          - pattern: $EL.insertAdjacentHTML($POS, $V)
          - pattern: document.write($V)
          - pattern: document.writeln($V)
          - pattern: $RES.send($V)
          - pattern: $EL.html($V)
      - metavariable-pattern:
          metavariable: $V
          pattern-either:
            - pattern: encodeURIComponent(...)
            - pattern: encodeURI(...)
            - pattern: escape(...)
            - pattern: $X.replace("<", ...)
            - pattern: $X.replace(/</g, ...)
            - pattern: $X.replace(/</, ...)
            - pattern: $X.replaceAll("<", ...)

  # ---------------------------------------------------------------- CORS / DNS
  - id: fortify.setting-manipulation-user-controlled-allow-list
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Setting Manipulation: User-Controlled Allow List: the CORS origin check reflects whatever Origin
      the request carries (origin: true, or a callback that always accepts), so every site is allowed
      and, with credentials, any page reads the user's data. Compare the origin against a fixed list.
    metadata:
      fortify:
        category: "Setting Manipulation: User-Controlled Allow List"
        kingdom: Input Validation and Representation
        impact: "2.0"
        probability: "3.0"
        accuracy: "4.0"
        confidence: "4.0"
        abstract: The CORS allow list is the request's own Origin header.
      cwe: ["CWE-942", "CWE-346"]
      owasp: ["A05:2021 Security Misconfiguration"]
    pattern-either:
      - pattern: '{ ..., origin: true, ... }'
      - pattern: '{ ..., reflectOrigin: true, ... }'
      - pattern: '{ ..., origin: ($O, $CB) => $CB(null, true), ... }'
      - pattern: '{ ..., origin: ($O, $CB) => $CB(null, $O), ... }'
      - pattern: '{ ..., origin: ($O, $CB) => { ... $CB(null, true); ... }, ... }'
      - pattern: '{ ..., origin: ($O, $CB) => { ... $CB(null, $O); ... }, ... }'
      - pattern: '{ ..., origin: function ($O, $CB) { ... $CB(null, true); ... }, ... }'
      - pattern: '{ ..., origin: function ($O, $CB) { ... $CB(null, $O); ... }, ... }'
      - pattern: '{ ..., origin: ($O, $CB) => $CB(null, $O ?? true), ... }'
      - pattern: '{ ..., origin: ($O, $CB) => $CB(null, $O || true), ... }'
      - pattern: '{ ..., origin: ($REQ) => $REQ.headers.origin, ... }'
      - pattern: '{ ..., origin: ($REQ) => $REQ.header("origin"), ... }'
      - patterns:
