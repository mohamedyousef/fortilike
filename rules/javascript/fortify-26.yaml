              - pattern: $RES.header("$H", $REQ.headers.origin)
              - pattern: $RES.set("$H", $REQ.headers.origin)
              - pattern: $RES.setHeader("$H", $REQ.get("origin"))
              - pattern: $RES.setHeader("$H", $REQ.header("origin"))
              - pattern: $RES.setHeader("$H", $REQ.headers["origin"])
          - metavariable-regex:
              metavariable: $H
              regex: (?i)^access-control-allow-origin$

  - id: fortify.dns-spoofing
