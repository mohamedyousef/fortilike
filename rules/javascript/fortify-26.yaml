  - id: fortify.weak-cryptographic-hash-empty-pbe-salt
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Weak Cryptographic Hash: Empty PBE Salt: the key derivation runs with an empty salt, so equal
      passwords give equal hashes and one precomputed table covers every account. Use a random salt of
      at least 16 bytes stored next to the hash.
