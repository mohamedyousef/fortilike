          - pattern: $F($P, $S, $N, ...)
          - pattern: $C.$F($P, $S, $N, ...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(pbkdf2|pbkdf2Sync)$
      - metavariable-comparison:
          metavariable: $N
          comparison: $N < 10000

  - id: fortify.weak-cryptographic-hash-predictable-salt
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
