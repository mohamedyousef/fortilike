      - pattern: 'React.createElement($T, { ..., dangerouslySetInnerHTML: $X, ... }, ...)'
      - pattern: 'createElement($T, { ..., dangerouslySetInnerHTML: $X, ... }, ...)'

  # ---------------------------------------------------------------- code correctness
  - id: fortify.code-correctness-negative-content-length
    languages: [javascript, typescript]
    severity: INFO
    message: >-
